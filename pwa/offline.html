<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a16" />
    <title>Reconnect to Hisar</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #edf6fa;
        background: radial-gradient(ellipse at 50% 0%, #132e3e, #0a0a16 70%);
        font: 1rem/1.55 system-ui, sans-serif;
      }
      main {
        width: min(100%, 26rem);
        padding: clamp(24px, 7vw, 40px);
        border: 1px solid #2a4354;
        border-radius: 24px;
        background: #101d2a;
        box-shadow: 0 24px 80px #05091380;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border: 1px solid #375a6c;
        border-radius: 16px;
        background: linear-gradient(145deg, #204558, #101b2d);
      }
      .mark svg { width: 46px; height: 46px; }
      .brand { margin: 24px 0 6px; color: #8dd9eb; font-size: .75rem; font-weight: 700; letter-spacing: .18em; }
      h1 { margin: 0; font-size: clamp(1.55rem, 6vw, 2rem); line-height: 1.15; }
      p { margin: 14px 0 24px; color: #bacbd7; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 8px 20px;
        border-radius: 10px;
        color: #0a1a24;
        background: #91def0;
        font-weight: 650;
        text-decoration: none;
      }
      a:hover { background: #b3ecf7; }
      a:focus-visible { outline: 2px solid #d0f5ff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><!-- HISAR_MARK --></div>
      <div class="brand">H.İ.S.A.R.</div>
      <h1>Hisar is unreachable</h1>
      <p>Check your connection and try again. Hisar needs to reach the server to open your vault.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
